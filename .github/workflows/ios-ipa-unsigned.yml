name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

env:
  CI: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Download source (public repo tarball)
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-master}"
          curl -fsSL "https://codeload.github.com/${{ github.repository }}/tar.gz/${BRANCH}" -o src.tar.gz
          tar xzf src.tar.gz --strip-components=1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create env file
        run: echo "EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-http://118.31.109.161}" > .env
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Install npm dependencies
        run: npm ci

      - name: Expo prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Build and package IPA
        env:
          DERIVED: ${{ runner.temp }}/DerivedData
          ARCHIVE: ${{ runner.temp }}/App.xcarchive
        run: bash scripts/build-ios-ipa-ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: office-manage-unsigned-ipa
          path: office-manage-unsigned.ipa
          retention-days: 30
