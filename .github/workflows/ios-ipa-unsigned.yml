name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

env:
  CI: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Download source (public repo tarball)
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-master}"
          curl -fsSL "https://codeload.github.com/${{ github.repository }}/tar.gz/${BRANCH}" -o src.tar.gz
          tar xzf src.tar.gz --strip-components=1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create env file
        run: echo "EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-http://118.31.109.161}" > .env
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Install npm dependencies
        run: npm ci

      - name: Expo prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: npx pod-install

      - name: Build and package IPA
        run: |
          set -e
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c "import json,sys;d=json.load(sys.stdin);s=[x for x in d['workspace']['schemes'] if 'test' not in x.lower()];print(s[0])")
          DERIVED="$RUNNER_TEMP/DerivedData"
          rm -rf "$DERIVED"
          echo "workspace=$WORKSPACE scheme=$SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED" \
            build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

          echo "Searching for .app in DerivedData..."
          find "$DERIVED/Build/Products" -maxdepth 3 -type d || true

          APP_PATH=$(find "$DERIVED/Build/Products" -type d -name '*.app' | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$DERIVED" -type d -name '*.app' | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: no .app found under $DERIVED"
            find "$DERIVED" -maxdepth 8 | head -300
            exit 1
          fi

          echo "Using app: $APP_PATH"
          cd "$GITHUB_WORKSPACE"
          mkdir -p Payload
          cp -r "$APP_PATH" "Payload/$(basename "$APP_PATH")"
          zip -qr office-manage-unsigned.ipa Payload
          ls -lh office-manage-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: office-manage-unsigned-ipa
          path: office-manage-unsigned.ipa
          retention-days: 30
