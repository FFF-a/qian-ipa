name: Build iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

env:
  CI: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Download source (public repo tarball)
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-master}"
          echo "Downloading branch: $BRANCH"
          curl -fsSL "https://codeload.github.com/${{ github.repository }}/tar.gz/${BRANCH}" -o src.tar.gz
          tar xzf src.tar.gz --strip-components=1
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create env file
        run: echo "EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-http://118.31.109.161}" > .env
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Install npm dependencies
        run: npm ci

      - name: Expo prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Verify iOS folder
        run: |
          test -d ios
          ls -la ios
          test -f ios/Podfile

      - name: Install CocoaPods
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: npx pod-install

      - name: Build unsigned iOS app
        id: ios_build
        run: |
          set -euo pipefail
          cd ios
          WORKSPACE=$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c "import json,sys;d=json.load(sys.stdin);s=[x for x in d['workspace']['schemes'] if 'test' not in x.lower()];print(s[0])")
          DERIVED="$RUNNER_TEMP/DerivedData"
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO
          APP_PATH=$(find "$DERIVED/Build/Products" -type d -name '*.app' | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app under DerivedData, listing:"
            find "$DERIVED" -maxdepth 6
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.ios_build.outputs.app_path }}"
          APP_NAME=$(basename "$APP_PATH")
          mkdir -p Payload
          cp -r "$APP_PATH" "Payload/$APP_NAME"
          zip -qr office-manage-unsigned.ipa Payload
          ls -lh office-manage-unsigned.ipa
          unzip -l office-manage-unsigned.ipa | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: office-manage-unsigned-ipa
          path: office-manage-unsigned.ipa
          retention-days: 30
